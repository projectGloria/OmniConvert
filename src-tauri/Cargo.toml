[package]
name = "omniconvert"
version = "0.1.0"
description = "Offline universal file converter"
edition = "2021"
rust-version = "1.80"

# Tauri wants a lib target; main.rs is a 3-line shim that calls lib::run().
[lib]
name = "omniconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Phase 1 keeps deps to the shell only. Engine crates (image, calamine, zip, ...)
# land in Phases 2–3 — pulling rav1e in now would require NASM just to `cargo check`.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2 # deps optimized even in dev; our own crate stays fast to rebuild

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # a panicking converter must fail its job, not abort the app
