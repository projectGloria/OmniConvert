[package]
name = "omniconvert"
version = "0.1.0"
description = "Offline universal file converter"
edition.workspace = true
rust-version.workspace = true

# Tauri wants a lib target; main.rs is a 3-line shim that calls lib::run().
[lib]
name = "omniconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Registry + pure-Rust engines (image, data, archive) — shared with the web build.
omniconvert-core = { path = "../crates/core" }

# --- Shell ---
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"

# --- Wire types: serde + TS codegen (bindings → src/types/generated via .cargo/config.toml) ---
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"

# --- Job queue ---
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "fs"] }
tokio-util = "0.7.20" # CancellationToken

# --- Sidecar-adjacent engines (desktop only) ---
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] } # pdfium page encode
pdfium-render = "0.9.5" # binds pdfium.dll at runtime from the resource dir
zip = { version = "7.3.0", default-features = false, features = ["deflate", "time"] } # frames → ZIP

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
csv = "1.4.0"
hound = "3.5.1"
serde_json = "1"
tempfile = "3.27.0"
