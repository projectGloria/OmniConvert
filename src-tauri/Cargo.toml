[package]
name = "omniconvert"
version = "0.1.0"
description = "Offline universal file converter"
edition = "2021"
rust-version = "1.93"

# Tauri wants a lib target; main.rs is a 3-line shim that calls lib::run().
[lib]
name = "omniconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Shell ---
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"

# --- Wire types: serde + TS codegen (bindings → src/types/generated via .cargo/config.toml) ---
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"

# --- Job queue ---
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "fs"] }
tokio-util = "0.7.20" # CancellationToken
dunce = "1.0.5"       # strips \\?\ verbatim prefixes before paths reach ffmpeg/pandoc

# --- Registry + data engine ---
infer = "0.22.0"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0" # serde_yaml is archived/unmaintained
toml = "1.2"
csv = "1.4.0"
calamine = { version = "0.38", features = ["dates"] }
rust_xlsxwriter = "0.102"
quick-xml = "0.37"
pulldown-cmark = "0.13.6"

# --- Image + PDF engines ---
# image's "avif" feature = ravif/rav1e encoder (AVIF *decode* goes through ffmpeg, see PLAN D7).
# image's "ico" encoder writes multi-size .ico natively, so no separate `ico` crate.
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp", "avif", "rayon"] }
webp = "0.3.1"     # lossy WebP (image crate encodes lossless only)
resvg = "0.49.0"   # SVG rasterization
lopdf = "0.47"     # Image → PDF with JPEG passthrough
pdfium-render = "0.9.5" # binds pdfium.dll at runtime from the resource dir

# --- Archive engine ---
zip = { version = "7.3.0", default-features = false, features = ["deflate", "time"] }
tar = "0.4.46"
flate2 = "1.1.10"
xz2 = "0.1.7"
sevenz-rust2 = "0.24"

[profile.dev.package."*"]
opt-level = 2 # deps optimized even in dev; our own crate stays fast to rebuild

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # a panicking converter must fail its job, not abort the app

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"
