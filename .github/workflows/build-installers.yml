name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 Setup
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-windows-x64

      - name: Cache sidecar binaries
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/resources
          key: ${{ runner.os }}-sidecars-${{ hashFiles('scripts/sidecars.lock.json') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch and verify sidecars
        run: npm run sidecars

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -like 'v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
            $version = $conf.version
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building OmniConvert version $version"

      - name: Build OmniConvert binary
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tauriArgs = @('tauri', 'build', '--no-bundle')
          if ($version -match '^\d+\.\d+\.\d+$') {
            $overridePath = Join-Path $env:RUNNER_TEMP 'tauri.version.conf.json'
            @{ version = $version } | ConvertTo-Json | Set-Content -Path $overridePath -Encoding utf8
            $tauriArgs += @('--config', $overridePath)
          }
          npx @tauriArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage app directory and fetch WebView2 bootstrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "app-dist"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $exe = @("target/release/omniconvert.exe", "src-tauri/target/release/omniconvert.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Built omniconvert.exe not found." }
          Copy-Item $exe (Join-Path $stage "omniconvert.exe") -Force

          foreach ($tool in 'ffmpeg', 'ffprobe', 'pandoc', 'typst') {
            $src = "src-tauri/binaries/$tool-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path $src)) { throw "Sidecar $src not found." }
            Copy-Item $src (Join-Path $stage "$tool.exe") -Force
          }

          $pdfium = "src-tauri/resources/pdfium.dll"
          if (-not (Test-Path $pdfium)) { throw "Resource $pdfium not found." }
          Copy-Item $pdfium (Join-Path $stage "pdfium.dll") -Force

          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile (Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe")

      - name: Pack installer with GloriaSetup
        id: pack
        uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          version: ${{ steps.meta.outputs.version }}
          webview2-bootstrapper: ${{ runner.temp }}\MicrosoftEdgeWebview2Setup.exe
          out-dir: installers
          upload: 'false'

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/*_x64-setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
