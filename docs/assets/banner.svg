<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="15" fill="none" stroke="#1E1E24" stroke-width="1.5"/>

  <!-- Subtle glow behind icon -->
  <circle cx="160" cy="160" r="90" fill="#6366F1" opacity="0.12" filter="url(#glow)"/>

  <!-- App Icon Group -->
  <g transform="translate(96, 96) scale(0.125)">
    <rect width="1024" height="1024" rx="224" fill="#121215"/>
    <rect x="24" y="24" width="976" height="976" rx="204" fill="none" stroke="#1E1E24" stroke-width="16"/>
    <g fill="none" stroke="url(#indigoGlow)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 420 A220 220 0 0 1 700 360"/>
      <path d="M700 240 L700 360 L580 360"/>
      <path d="M724 604 A220 220 0 0 1 324 664"/>
      <path d="M324 784 L324 664 L444 664"/>
    </g>
    <circle cx="512" cy="512" r="56" fill="#10B981"/>
  </g>

  <!-- Title & Tagline -->
  <text x="260" y="135" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.02em">OmniConvert</text>
  <text x="260" y="175" fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Offline Universal File Converter for Windows &amp; Web</text>

  <!-- Feature Pills -->
  <g transform="translate(260, 210)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="168" height="32" rx="16" fill="#121215" stroke="#1E1E24"/>
    <circle cx="16" cy="16" r="4" fill="#10B981"/>
    <text x="28" y="21" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">100% Offline &amp; Private</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="168" height="32" rx="16" fill="#121215" stroke="#1E1E24"/>
    <circle cx="196" cy="16" r="4" fill="#6366F1"/>
    <text x="208" y="21" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">46 Formats · 6 Domains</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="186" height="32" rx="16" fill="#121215" stroke="#1E1E24"/>
    <circle cx="376" cy="16" r="4" fill="#F59E0B"/>
    <text x="388" y="21" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Hardware Transcoding</text>

    <!-- Pill 4 -->
    <rect x="558" y="0" width="162" height="32" rx="16" fill="#121215" stroke="#1E1E24"/>
    <circle cx="574" cy="16" r="4" fill="#3B82F6"/>
    <text x="586" y="21" fill="#EDEDEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Rust Core · Zero Bloat</text>
  </g>
</svg>
